# Filet de securite pour le cron.
#
# Le plan Vercel Hobby limite les taches planifiees a UNE execution par jour,
# declenchee a +/- 59 minutes de l'heure visee, et sans reessai en cas d'echec.
# Si le portail est indisponible a ce moment-la, le rappel du jour est perdu.
#
# Ce workflow rappelle le meme endpoint un peu plus tard. L'endpoint est
# idempotent (contrainte d'unicite sur les envois), donc un declenchement en
# double n'envoie pas deux mails.
#
# Secrets a definir dans le depot : APP_URL et CRON_SECRET.

name: Rappel cantine (secours)

on:
  schedule:
    # 19h00 UTC, soit trois heures apres le cron Vercel, en gardant de la marge
    # avant minuit heure de Paris.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declencher:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'endpoint de rappel
        # Les secrets passent par l'environnement, pas par interpolation dans la
        # ligne de commande : celle-ci est visible dans la table des processus du
        # runner, et une valeur contenant un caractere shell y serait interpretee.
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL et CRON_SECRET requis." >&2
            exit 1
          fi
          # --max-time borne l'attente : l'endpoint peut tenir 300 s, au-dela
          # c'est qu'il ne repondra plus.
          code=$(curl -sS --max-time 320 -o reponse.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron")
          echo "HTTP $code"
          # La reponse est un resume agrege, sans adresse email : les logs de ce
          # workflow sont publics puisque le depot l'est.
          cat reponse.json
          [ "$code" = "200" ]
